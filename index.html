<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كاسبر جيمز | منصة الألعاب التفاعلية للبث المباشر</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #020617;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        h1 {
            color: #38bdf8;
            margin-top: 20px;
            font-size: 2.2rem;
        }
        p {
            color: #94a3b8;
            margin-bottom: 40px;
        }
        .games-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            max-width: 900px;
            margin: 0 auto;
        }
        .game-card {
            background-color: #0f172a;
            border: 2px solid #1e293b;
            border-radius: 16px;
            padding: 25px;
            width: 260px;
            text-decoration: none;
            color: white;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.4);
        }
        .game-card:hover {
            border-color: #38bdf8;
            transform: translateY(-6px);
            background-color: #1e293b;
        }
        .game-card h3 {
            margin: 0 0 10px 0;
            color: #f8fafc;
            font-size: 1.4rem;
        }
        .game-card p {
            margin: 0;
            font-size: 0.95rem;
            color: #64748b;
        }
    </style>
</head>
<body>

    <h1>🎮 كاسبر جيمز - Casper Games</h1>
    <p>اختر اللعبة وابدأ البث والتفاعل مع المتابعين مباشرة:</p>

    <div class="games-grid">
        <!-- تقدر تعدل اسم الرابط ومكان اللعبة حسب المجلدات الموجودة عندك -->
        <a href="./boxing/index.html" class="game-card">
            <h3>لعبة الملاكمة التفاعلية</h3>
            <p>اضغط لبدء التحدي بالهدايا والكبس</p>
        </a>

        <a href="./casper-runner/index.html" class="game-card">
            <h3>لعبة الجري (كاسبر)</h3>
            <p>المغامرة الحماسية للبث المباشر</p>
        </a>
    </div>

</body>
</html>
